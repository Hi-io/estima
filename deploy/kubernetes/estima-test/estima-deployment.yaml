apiVersion: apps/v1
kind: Deployment
metadata:
  name: estima
  labels:
    app.kubernetes.io/name: estima
    app.kubernetes.io/part-of: estima-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: estima
  template:
    metadata:
      labels:
        app.kubernetes.io/name: estima
        app.kubernetes.io/part-of: estima-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-1
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: estima
          image: ghcr.io/hi-io/estima:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fcapsule-atlas-runtime
                  key: DATABASE_URL
            - name: ESTIMA_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fcapsule-atlas-runtime
                  key: ATLAS_API_TOKEN
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
