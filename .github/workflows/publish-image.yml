name: Publish container

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA with a passing Tests workflow run
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate requested source SHA
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' "source_sha must be a full 40-character lowercase commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Verify requested source and successful tests
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          actual_sha=$(git rev-parse HEAD)
          if [[ "$actual_sha" != "$SOURCE_SHA" ]]; then
            printf '%s\n' "Checked out commit does not match source_sha." >&2
            exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$SOURCE_SHA&per_page=100")
          latest_status=$(jq -r --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | first | [.status // "missing", .conclusion // ""] | join(":")' <<<"$runs")
          if [[ "$latest_status" != "completed:success" ]]; then
            printf '%s\n' "The latest Tests workflow run for source_sha must have succeeded." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        if: github.event_name != 'workflow_dispatch'
        with:
          images: |
            ghcr.io/hi-io/collective
            ghcr.io/hi-io/estima
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/metadata-action@v5
        id: manual-meta
        if: github.event_name == 'workflow_dispatch'
        with:
          context: git
          images: |
            ghcr.io/hi-io/collective
            ghcr.io/hi-io/estima
          tags: |
            type=raw,value=sha-${{ inputs.source_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags || steps.manual-meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels || steps.manual-meta.outputs.labels }}
