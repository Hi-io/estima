name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estima_test
          POSTGRES_USER: estima
          POSTGRES_PASSWORD: estima-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estima -d estima_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ESTIMA_TEST_DATABASE_URL: postgresql://estima:estima-test-password@localhost:5432/estima_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: docker build --tag estima-service:test .
